name: Check Android wrapper
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Check allowed URLs
        run: |
          mkdir -p /tmp/dmsh-android-tests
          javac -d /tmp/dmsh-android-tests app/src/main/java/ru/dmsh/victorina/SitePolicy.java tests/ru/dmsh/victorina/SitePolicyTest.java
          java -cp /tmp/dmsh-android-tests ru.dmsh.victorina.SitePolicyTest
      - run: ./gradlew assembleDebug lintRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-for-testing
          path: android/app/build/outputs/apk/debug/*.apk
