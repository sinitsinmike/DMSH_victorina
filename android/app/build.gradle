plugins { id 'com.android.application' }
def signingFile = rootProject.file('.signing/signing.properties')
def signingProps = new Properties()
if (signingFile.exists()) signingFile.withInputStream { signingProps.load(it) }
android {
    namespace 'ru.dmsh.victorina'
    compileSdk 35
    defaultConfig {
        applicationId 'ru.dmsh.victorina'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        if (signingFile.exists()) {
            localRelease {
                storeFile rootProject.file('.signing/release.jks')
                storePassword signingProps['storePassword']
                keyAlias signingProps['keyAlias']
                keyPassword signingProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (signingFile.exists()) signingConfig signingConfigs.localRelease
        }
    }
}
